[package]
name = "refuge"
version = "0.1.0"
edition = "2024"
description = "Local-first Git repository backup"
license = "MIT"
repository = "https://github.com/HenryZhang-ZHY/refuge"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
dunce = "1.0"
fs2 = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tempfile = "3.22"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
cucumber = "0.23"
predicates = "3.1"

[[test]]
name = "bdd_first_use"
harness = false

[[test]]
name = "bdd_lfs"
harness = false
